<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preload" as="image" href="/derbyfit-logo-ink.png" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Derpy Fit</title>
    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        padding: 0 24px;
        will-change: opacity;
      }

      #initial-splash-logo {
        height: 44px;
        width: auto;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        will-change: transform, opacity, filter;
        animation: splash-logo-enter 220ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @media (min-width: 640px) {
        #initial-splash-logo {
          height: 50px;
        }
      }

      @media (min-width: 768px) {
        #initial-splash-logo {
          height: 56px;
        }
      }

      @keyframes splash-logo-enter {
        0% {
          opacity: 0.35;
          transform: translateY(5px) scale(0.96);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-splash" aria-hidden="true">
      <img
        id="initial-splash-logo"
        src="/derbyfit-logo-ink.png"
        alt="Derpy Fit"
        fetchpriority="high"
        decoding="sync"
        draggable="false"
      />
    </div>
    <script>
      (function () {
        var img = document.getElementById("initial-splash-logo");
        if (!img) return;
        function applySquareFavicon() {
          if (!img.naturalWidth || !img.naturalHeight) return;
          var size = 128;
          var canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;
          var ctx = canvas.getContext("2d");
          if (!ctx) return;
          ctx.beginPath();
          if (typeof ctx.roundRect === "function") {
            ctx.roundRect(0, 0, size, size, 30);
          } else {
            ctx.rect(0, 0, size, size);
          }
          ctx.fillStyle = "#ffffff";
          ctx.fill();
          ctx.clip();
          var sx = img.naturalWidth * 0.025;
          var sy = img.naturalHeight * 0.16;
          var sw = img.naturalWidth * 0.95;
          var sh = img.naturalHeight * 0.72;
          var drawW = size - 10;
          var drawH = drawW * (sh / sw);
          var dx = (size - drawW) / 2;
          var dy = (size - drawH) / 2;
          ctx.drawImage(img, sx, sy, sw, sh, dx, dy, drawW, drawH);
          var link = document.getElementById("app-favicon");
          if (link) {
            link.setAttribute("type", "image/png");
            link.setAttribute("href", canvas.toDataURL("image/png"));
          }
        }
        if (img.complete && img.naturalWidth) {
          applySquareFavicon();
        } else {
          img.addEventListener("load", applySquareFavicon, { once: true });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
